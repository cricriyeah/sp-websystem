# Corre en cada push y cada PR. Existe porque los 125 tests del backend cubren
# justo lo delicado (cupo, ventana de salida, deslinde, cobro duplicado,
# reembolso fallido) y hasta ahora no los corria nadie antes de desplegar: una
# regresion en el webhook se descubria con un cliente que ya habia pagado.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # La suite corre contra los dos motores. sqlite es lo que usa quien
    # desarrolla en local; Postgres es lo que corre en produccion, y las
    # diferencias entre ambos no son cosmeticas — sqlite serializa toda escritura
    # con un solo escritor, asi que cualquier condicion de carrera es invisible
    # ahi por construccion. Correr solo en sqlite fue lo que dejo pasar F-19.
    strategy:
      fail-fast: false
      matrix:
        include:
          - motor: sqlite
            settings: config.settings.local
          - motor: postgres
            settings: config.settings.ci

    name: backend (${{ matrix.motor }})

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pescadeportiva_test
        ports:
          - 5432:5432
        # Sin esto los tests arrancan antes de que Postgres acepte conexiones y
        # fallan con "connection refused" de forma intermitente.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Sin llaves de Stripe ni de Resend: las rutas de cobro y de notificacion
      # van con esas APIs simuladas, asi que el CI no necesita credenciales.
      # Se incluye `config` ademas de `apps` — ahi vive la prueba de la sonda de
      # salud (config/tests_health.py), que `test apps` no recogeria.
      - name: Tests (${{ matrix.motor }})
        env:
          DJANGO_SETTINGS_MODULE: ${{ matrix.settings }}
          DB_NAME: pescadeportiva_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py test apps config --verbosity 2

      # `check --deploy` audita la configuracion real de produccion (SSL, HSTS,
      # cookies, SECRET_KEY). Con variables de relleno: no se conecta a nada, solo
      # revisa settings, pero production.py revienta si falta alguna.
      - name: Revision de settings de produccion
        # Solo una vez: no depende del motor de base, revisa settings estaticos.
        if: matrix.motor == 'postgres'
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          # Larga y variada a proposito: `check --deploy` avisa (W009) de las
          # claves cortas o predecibles, y este relleno no debe disparar ese
          # aviso o taparia uno de verdad. No es un secreto, no abre nada.
          DJANGO_SECRET_KEY: nR7wKq2ZxP9mTvL4bE6yGjH8sD3fA5cU1oI0eYtXwQzVnMkRpB
          DJANGO_ALLOWED_HOSTS: example.com
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          DB_HOST: localhost
        run: python manage.py check --deploy --fail-level WARNING

  # Escaneo de CVEs de las dos mitades. Va en un job aparte, y no dentro de los
  # de tests/build, porque un aviso publicado hoy en una dependencia transitiva
  # no deberia bloquear un cambio que no la toca. Falla visible, no bloqueante:
  # se revisa y se arregla, pero en su propio tiempo.
  auditoria-dependencias:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      - name: CVEs de Python
        run: pip-audit -r requirements.txt --strict
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: CVEs de npm
        run: npm audit --audit-level=high
        working-directory: frontend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Next genera los tipos de rutas (`PageProps`, `LayoutProps`) dentro de
      # .next/, y `next-env.d.ts` los importa de ahi. En una maquina de trabajo
      # ya existen porque el dev server los dejo; en CI, recien clonado, no —
      # asi que `tsc` falla con "Cannot find name 'PageProps'" sin este paso.
      # `typegen` los genera sin pagar un build completo.
      - name: Generar tipos de rutas
        run: npx next typegen

      # Los tres pasos que hoy se corren a mano y se olvidan.
      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
