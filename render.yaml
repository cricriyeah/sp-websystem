# Infraestructura de Render en el repo (Blueprint).
#
# Antes esto vivia solo en el dashboard: si alguien borraba un cron o le movia el
# horario no quedaba rastro ni forma de revisarlo, y `conciliar_pagos` es
# justamente la red que atrapa a un cliente que pago y se quedo sin reserva.
#
# Las variables marcadas `sync: false` NO se guardan aqui: son secretos y se
# capturan en el dashboard la primera vez. Este archivo nunca debe contener una
# llave de Stripe ni la contraseña de la base.
#
# Para aplicarlo: Render Dashboard > Blueprints > New Blueprint Instance,
# apuntando a este repo. Ojo: al adoptar el blueprint, los servicios que ya
# existan hay que enlazarlos por nombre o Render crea unos nuevos al lado.

services:
  - type: web
    name: pescadeportiva-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    # Sin `--workers` gunicorn arranca uno solo y una peticion lenta a Stripe
    # bloquea al resto. 3 es lo que sostiene el plan starter sin quedarse sin RAM.
    startCommand: gunicorn config.wsgi:application --workers 3 --timeout 60
    # NO apuntar esto a una ruta que dependa de datos de negocio. Estuvo en
    # /api/tarifa/, que responde 503 mientras no exista la fila de Tarifa: en una
    # base recien migrada no existe, el health check nunca pasaba y Render
    # cancelaba el deploy — pero la Tarifa no se puede crear hasta que el
    # servicio este arriba. /healthz solo comprueba proceso vivo + base
    # alcanzable (ver backend/config/health.py).
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.14"
      # Anticipación mínima de la reserva web, en horas antes de la salida (backend/apps/bookings/anticipacion.py).
      - key: HORAS_MINIMAS_RESERVA
        value: "16"
      # IVA que se suma al final del cobro (fraccion; 0.16 = 16 %). Los precios del catalogo van sin IVA.
      # El frontend lleva su espejo en NEXT_PUBLIC_IVA_TASA (Vercel) y deben coincidir.
      - key: IVA_TASA
        value: "0.16"
      # Apartado temporal de cupo mientras el cliente paga («tu lugar esta guardado hasta...»).
      # 0 = apagado: con 0 en produccion el cliente nunca ve el aviso (prueba del 2026-10-23).
      # Si este servicio no se sincroniza desde este archivo, la variable tambien hay que ponerla
      # a mano en el dashboard de Render (Environment) y reiniciar.
      - key: APARTADO_MINUTOS
        value: "15"
      # Un salto de proxy: el balanceador de Render. Ver
      # backend/apps/bookings/serializers.py (constancia del deslinde).
      # Mayor que 0 = hay proxies delante y se le cree a X-Forwarded-For; la IP del cliente se saca
      # saltando los proxies conocidos (Cloudflare, redes internas), no contando saltos.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Arranca en 1 hora. Subir a 31536000 tras un par de dias con https estable
      # — el navegador recuerda este valor y no se puede retirar antes de tiempo.
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      # Solo de la web: los cron no atienden peticiones ni cobran.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # URL publica del sitio para los enlaces de retomar que manda el backend (https://www.salysoltours.com).
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - fromGroup: pescadeportiva-secrets

  # Red de seguridad del cobro: una entrega de webhook puede perderse para
  # siempre (backend caido, secret mal puesto, Stripe se rinde tras sus
  # reintentos) y entonces hay alguien que pago y no tiene reserva. Esto le
  # pregunta a Stripe como quedo cada pago pendiente y aplica lo mismo que el
  # webhook. Es idempotente: en la segunda vuelta ya no encuentra nada.
  - type: cron
    name: pescadeportiva-conciliar-pagos
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    schedule: "0 * * * *"  # cada hora en punto
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py conciliar_pagos --dias 7
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.14"
      - fromGroup: pescadeportiva-secrets

  # Borra las filas `pendiente_pago` viejas (checkouts que nadie termino) para
  # que la lista de recuperacion no crezca sin fin. Nunca toca una reserva pagada.
  - type: cron
    name: pescadeportiva-limpiar-checkouts
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    schedule: "30 9 * * *"  # 09:30 UTC = 02:30 en America/Mazatlan, fuera de horario
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py limpiar_checkouts_abandonados --dias 30
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.14"
      - fromGroup: pescadeportiva-secrets

  # Purga la bitacora de la recuperacion de contrasena (apps/cuentas): guarda hash de correo e IP de cada
  # solicitud, asi que no debe crecer sin fin. Los limites solo miran el ultimo dia.
  - type: cron
    name: pescadeportiva-limpiar-recuperacion
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    schedule: "45 9 1 * *"  # dia 1 de cada mes, 09:45 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py limpiar_eventos_recuperacion --dias 90
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.14"
      - fromGroup: pescadeportiva-secrets

  # Purga las notificaciones del backoffice (apps/tenancy) de hace mas de 90 dias, de todas las empresas (el command
  # corre como operador de plataforma por la RLS). Las lecturas caen en cascada. Diario para que la tabla y el conteo
  # del sondeo se mantengan baratos; no se empalma con checkouts (30 9) ni con recuperacion (45 9 el dia 1).
  - type: cron
    name: pescadeportiva-limpiar-notificaciones
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    schedule: "15 9 * * *"  # 09:15 UTC = 02:15 en America/Mazatlan, fuera de horario
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py limpiar_notificaciones --dias 90
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.14"
      - fromGroup: pescadeportiva-secrets

# Credenciales compartidas por los tres servicios. Se capturan una sola vez en
# este grupo (dashboard > Environment Groups) en vez de repetirlas —y arriesgarse
# a que se desincronicen— en cada uno. `DJANGO_SECRET_KEY` va aqui y no como
# `generateValue` en la web: si cada servicio generara la suya, serian tres
# distintas y cualquier cosa firmada por uno no la reconoceria el otro.
envVarGroups:
  - name: pescadeportiva-secrets
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Direccion del negocio que recibe copia oculta de cada confirmacion. Es el
      # rastro fuera de la base para reconstruir reservas despues de restaurar un
      # respaldo (ver docs/vendors/supabase.md). Verificar bien el valor: una
      # direccion equivocada manda datos de clientes a un tercero.
      - key: RESEND_BCC
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Alertas de error (sentry.io). Sin esta variable no se manda nada y el
      # backend funciona igual. El plan gratuito cubre 5,000 errores al mes, de
      # sobra para este volumen — si se llega al tope, es señal de que hay algo
      # roto que arreglar, no de que haga falta pagar.
      #
      # Va en el grupo y no en el servicio web porque los cron tambien la
      # necesitan. Estuvo solo en la web, y eso dejaba a `conciliar_pagos`
      # corriendo cada hora sin vigilancia: si falla, nadie se entera — y ese
      # cron es justo la red que atrapa a un cliente que pago y se quedo sin
      # reserva. El fallo mas caro del sistema es tambien el mas silencioso.
      - key: SENTRY_DSN
        sync: false
      # Secret de Cloudflare Turnstile, el gate anti-bot de POST /api/reservas/
      # (ver backend/apps/bookings/captcha.py). Sin ella la verificacion es un
      # no-op y el checkout acepta todo, asi que si el sitio ya esta en vivo hay
      # que ponerla. La site key publica correspondiente va en Vercel como
      # NEXT_PUBLIC_TURNSTILE_SITE_KEY — son un par, tienen que salir del mismo
      # widget del dashboard de Cloudflare.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Site key del mismo widget, ahora tambien en el backend: la pantalla de recuperacion de contrasena del
      # admin (/admin/recuperar/) pinta el widget y exige Turnstile cerrado. Mismo valor que
      # NEXT_PUBLIC_TURNSTILE_SITE_KEY en Vercel; el widget debe listar el hostname del backend. Sin ella, 503.
      - key: TURNSTILE_SITE_KEY
        sync: false
      # Opcional: correos (CSV) que reciben un aviso, sin codigo, de cada cambio de contrasena por recuperacion.
      - key: RECUPERACION_AVISO_ADMIN
        sync: false
      # Clave con que se cifran en la base las llaves de Stripe de cada Empresa (backend/apps/tenancy/campos.py).
      # Va en el grupo porque los cron (conciliar_pagos) tambien leen esas llaves: sin la clave veran el texto
      # cifrado y no podran hablar con Stripe. Generar una y guardarla TAMBIEN fuera de Render (si se pierde,
      # las llaves se vuelven a capturar en el admin):
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Despues de ponerla: python manage.py cifrar_llaves_stripe. Obligatoria antes de la primera sk_live_.
      - key: STRIPE_KEYS_ENCRYPTION_KEY
        sync: false
